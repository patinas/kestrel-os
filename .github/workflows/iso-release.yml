name: iso-release
# Manually dispatched only after owner approval. Stages a draft; human visual gate publishes.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iso-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KESTREL_CI_ALLOW_TCG: false
    steps:
      - uses: actions/checkout@v4
      - name: Host setup
        run: build/tests/ci/00-host.sh
      - name: Build ISO
        run: build/tests/ci/01-build-iso.sh
      - name: Firmware boot and screenshots
        run: |
          sudo apt-get install -y --no-install-recommends imagemagick
          build/tests/ci/06-iso-boot.sh
      - name: Verify single file or split parts
        run: build/tests/ci/07-split.sh
      - name: Prepare VM inputs
        run: build/tests/ci/02-prepare.sh
      - name: Install to disposable qcow2 exactly as a real user (no test overlay or test kernel args)
        env:
          JOB: ci-install-plain.sh
        run: build/tests/ci/03-install.sh
      - name: Boot the installed disk over UEFI and capture shell screenshots
        run: build/tests/ci/09-install-evidence.sh
      - name: Stage draft pre-release (no Actions artifact storage)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(cat "$CI_DIR/delivery/MODE")
          if [ "$mode" = single ]; then
            NOTE_DL="Download the single ISO file and verify it with SHA256SUMS.iso. SHA256 provides integrity, not a release-signing guarantee."
            ASSETS=("$CI_DIR"/delivery/*.iso)
          else
            NOTE_DL="Download all numeric ISO parts and SHA256SUMS.parts, verify each part, concatenate in order into the original ISO filename, then verify SHA256SUMS.iso. Each part is below 2 GiB. SHA256 provides integrity, not a release-signing guarantee."
            ASSETS=("$CI_DIR"/delivery/*.iso.part[0-9][0-9])
          fi
          tag="alpha-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          cat > "$CI_DIR/notes.md" <<NOTES
          Experimental x86_64 UEFI live and install alpha. Not tested on real hardware. The installer erases one selected internal disk after disk selection and a typed erase confirmation; every selected disk is wiped completely.
          Source: $GITHUB_SHA
          Build and verification: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          $NOTE_DL
          Proven on this exact source in QEMU/KVM UEFI VMs only: live boot, full-disk install, installed boot to the shell (screenshots attached: iso-*.png live, install-*.png installed). A/B updates with signed images and rollback are proven by the vm-test workflow on the same source. Real hardware, GPU, Wi-Fi, Bluetooth and audio are not certified.
          UI is a browser shell with external Search/Mail/Video/Games shortcuts, not built-in native apps. Gaming, GPU, ARM, browser interaction and hardware compatibility are not certified.
          NOTES
          cat "$CI_DIR/delivery/SHA256SUMS.iso" >> "$CI_DIR/notes.md"
          # Create the draft first, then upload each asset with retries: a transient 404 from the upload
          # endpoint must not strand a half-uploaded draft (run 39101912995).
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "Kestrel OS alpha (UEFI live + install test)" --notes-file "$CI_DIR/notes.md"
          for f in "${ASSETS[@]}" "$CI_DIR"/delivery/SHA256SUMS.* "$CI_DIR"/vm/iso-*.png "$CI_DIR"/vm/install-*.png; do
            base=$(basename "$f")
            for attempt in 1 2 3 4; do
              gh release upload "$tag" "$f" && break
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$base"; then break; fi
              echo "upload of $base failed (attempt $attempt); pausing before retry"
              sleep $((attempt*20))
            done
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$base" || { echo "::error::asset missing after retries: $base"; exit 1; }
          done
          echo "Draft tag: $tag" >> "$GITHUB_STEP_SUMMARY"
