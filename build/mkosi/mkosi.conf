# Phase 2 VM prototype. Not a production image or secure installer.
[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=disk
Output=kestrel-x86_64.raw

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=kestrel-dev
Packages=base
         linux
         systemd
         chromium
         mesa
         xorg-xwayland
         cage
         dbus
         linux-firmware

# TODO: add immutable partitions, signed UKIs, A/B updates, user setup,
# GPU-specific packages and the Kestrel compositor. This prototype uses
# Cage as a temporary Wayland kiosk, not the final shell.
